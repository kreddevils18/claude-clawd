name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace
        run: claude plugin validate .
      - name: Validate the plugin and its hooks
        run: claude plugin validate .claude-plugin/plugin.json --strict
      - name: Test
        run: claude plugin test .
      - name: Type-check
        run: npx -y -p typescript tsc --noEmit
      - name: Gallery is up to date
        run: node --experimental-strip-types scripts/build-gallery.ts --check
